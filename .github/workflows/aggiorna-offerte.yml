name: 🛒 Aggiorna Offerte Supermercati

on:
  # Esegui ogni martedì alle 07:30 (ora italiana = 05:30 UTC)
  schedule:
    - cron: '30 5 * * 2'
  
  # Permetti esecuzione manuale dalla dashboard GitHub
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Forza il deploy anche senza nuove offerte'
        required: false
        default: 'false'
        type: boolean

jobs:
  scrape-and-deploy:
    name: Scraper Offerte + Deploy Netlify
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout del codice
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Node.js
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Installa dipendenze sistema (Ubuntu)
      - name: 📦 Installa dipendenze sistema per Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2

      # 4. Installa dipendenze scraper (Node)
      - name: 📦 Installa dipendenze Node.js
        working-directory: scraper
        run: npm install

      # 5. Esegui lo scraper
      - name: 🔍 Esegui scraper offerte
        working-directory: scraper
        run: node index.js
        env:
          # Puppeteer in modalità headless su Linux CI
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'false'

      # 5. Verifica se offerte.json è cambiato
      - name: 🔎 Verifica modifiche
        id: check_changes
        run: |
          if git diff --quiet offerte.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Nessuna modifica alle offerte."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Offerte aggiornate!"
            git diff --stat offerte.json
          fi

      # 6. Commit e push del nuovo offerte.json
      - name: 💾 Salva offerte aggiornate
        if: steps.check_changes.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true'
        run: |
          git config --global user.name "SpesaBot 🛒"
          git config --global user.email "spesabot@noreply.github.com"
          git add offerte.json
          git commit -m "🏷️ Aggiorna offerte settimanali - $(date '+%d/%m/%Y')"
          git push

      # 7. Deploy su Netlify (tramite Deploy Hook URL)
      - name: 🚀 Deploy su Netlify
        if: steps.check_changes.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true'
        run: |
          # Attiva il deploy hook di Netlify
          curl -s -X POST "${{ secrets.NETLIFY_DEPLOY_HOOK }}"
          echo "✅ Netlify deploy avviato!"
        continue-on-error: true  # Non blocca il workflow se Netlify non è configurato

      # 8. Riepilogo
      - name: 📊 Riepilogo
        run: |
          echo "### 🛒 Aggiornamento Offerte Completato" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valore |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Data esecuzione | $(date '+%d/%m/%Y %H:%M') |" >> $GITHUB_STEP_SUMMARY
          echo "| Offerte modificate | ${{ steps.check_changes.outputs.changed }} |" >> $GITHUB_STEP_SUMMARY
          if [ -f "offerte.json" ]; then
            COUNT=$(python3 -c "import json; d=json.load(open('offerte.json')); print(len(d.get('offers',[])))")
            echo "| Numero offerte | $COUNT |" >> $GITHUB_STEP_SUMMARY
          fi
