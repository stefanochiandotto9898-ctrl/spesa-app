name: 🛒 Aggiorna Offerte Supermercati

on:
  # Esegui ogni martedì alle 07:30 (ora italiana = 05:30 UTC)
  schedule:
    - cron: '30 5 * * 2'
  
  # Permetti esecuzione manuale dalla dashboard GitHub
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Forza il deploy anche senza nuove offerte'
        required: false
        default: 'false'
        type: boolean

jobs:
  scrape-and-deploy:
    name: Scraper Offerte + Deploy Netlify
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout del codice
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Node.js
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Installa dipendenze sistema (Ubuntu)
      - name: 📦 Installa dipendenze sistema per Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2 libxdamage1 libxkbcommon0 libpango-1.0-0 libcairo2

      # 4. Installa Chrome
      - name: 🌐 Installa Chrome
        run: npx puppeteer browsers install chrome

      # 5. Installa dipendenze scraper (Node)
      - name: 📦 Installa dipendenze Node.js
        working-directory: scraper
        run: npm install

      # 6. Setup Python per lo scraper volantini
      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Installa dipendenze Python
        run: |
          pip install playwright requests
          python3 -m playwright install --with-deps chromium

      # 7. Esegui gli scraper
      - name: 🔍 Esegui scraper offerte (Node)
        working-directory: scraper
        run: node index.js
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'false'

      - name: 📄 Esegui scraper volantini (Python)
        working-directory: scraper
        run: python3 volantini_scraper.py

      # 8. Verifica se ci sono cambiamenti
      - name: 🔎 Verifica modifiche
        id: check_changes
        run: |
          git add offerte.json volantini.json volantini/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Nessuna modifica rilevata."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Modifiche rilevate!"
          fi

      # 9. Commit e push
      - name: 💾 Salva dati aggiornati
        if: steps.check_changes.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true'
        run: |
          git config --global user.name "SpesaBot 🛒"
          git config --global user.email "spesabot@noreply.github.com"
          git commit -m "🏷️ Aggiorna offerte e volantini - $(date '+%d/%m/%Y')"
          git push

      # 10. Riepilogo
      - name: 📊 Riepilogo
        run: |
          echo "### 🛒 Aggiornamento Completato" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tipo | Risultato |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Offerte | ${{ steps.check_changes.outputs.changed }} |" >> $GITHUB_STEP_SUMMARY
          if [ -f "volantini.json" ]; then
            COUNT=$(python3 -c "import json; d=json.load(open('volantini.json')); print(len(d.get('flyers',[])))")
            echo "| Volantini scaricati | $COUNT |" >> $GITHUB_STEP_SUMMARY
          fi
