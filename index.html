<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Spesa">
    <title>La Mia Spesa</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container dark-dashboard">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-left">
                <div class="avatars">
                    <div class="avatar avatar-1">S</div>
                    <div class="avatar avatar-2">F</div>
                </div>
                <div class="greeting">Ciao, Stefano e Francesca!</div>
            </div>
            <div class="header-right">
                <div class="savings-card">
                    <span class="savings-label">RISPARMIO MESE:</span>
                    <span class="savings-amount">€45.20</span>
                </div>
            </div>
        </header>

        <!-- Main Dashboard Content -->
        <div class="dashboard-content">
            
            <!-- LISTA CONDIVISA -->
            <section class="dashboard-section shared-list-section">
                <div class="section-header">
                    <h2>LISTA CONDIVISA</h2>
                    <button class="more-options">...</button>
                </div>
                <div class="shared-list-card">
                    <ul id="shopping-list" class="new-shopping-list">
                        <!-- Items generated via JS -->
                    </ul>
                </div>
            </section>

            <!-- MIDDLE GRID -->
            <section class="dashboard-grid-2">
                <!-- FORSE SONO FINITI -->
                <div class="dashboard-card small-card predictive-card">
                    <h3>FORSE SONO FINITI</h3>
                    <div id="predictive-section">
                        <ul id="predictive-list" class="predictive-content">
                            <!-- Items generated via JS -->
                        </ul>
                    </div>
                </div>
                
                <!-- TOTALE STIMATO -->
                <div class="dashboard-card small-card total-card">
                    <h3 style="display:flex; justify-content:space-between;">TOTALE STIMATO: <span id="total-amount">€0.00</span></h3>
                    <div class="total-subtitle">Dettagli Spese</div>
                    <div class="chart-mockup">
                        <svg viewBox="0 0 100 30" class="sparkline" preserveAspectRatio="none" style="width:100%; height:40px;">
                            <path d="M0,25 L20,15 L40,20 L60,10 L80,15 L100,5" fill="none" stroke="var(--chart-color)" stroke-width="2"/>
                            <path d="M0,25 L20,15 L40,20 L60,10 L80,15 L100,5 L100,30 L0,30 Z" fill="url(#grad)" stroke="none" opacity="0.3"/>
                            <defs>
                                <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="var(--chart-color)" stop-opacity="0.8"/>
                                    <stop offset="100%" stop-color="var(--chart-color)" stop-opacity="0"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                </div>
            </section>

            <!-- VOLANTINI E OFFERTE -->
            <section class="dashboard-section flyers-section">
                <div class="section-header">
                    <h2>VOLANTINI E OFFERTE</h2>
                    <div class="nav-arrows">
                        <button>&lt;</button>
                        <button>&gt;</button>
                    </div>
                </div>
                <div class="flyers-carousel">
                    <ul id="flyers-list" class="horizontal-list">
                        <!-- Flyers generated via JS -->
                    </ul>
                </div>
            </section>

        </div> <!-- /dashboard-content -->

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item active">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </button>
            <button class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
            </button>
            
            <div class="fab-wrapper">
                <button id="add-fab" class="fab">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
                <div class="fab-label">Aggiungi Prodotto</div>
            </div>

            <button class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            </button>
            <button class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </button>
        </nav>

        <!-- Modals -->
        <div id="add-item-modal" class="modal-backdrop hidden">
            <div class="ios-modal-content add-modal" style="background: var(--bg-dashboard); color: white; border: 1px solid var(--border-dark);">
                <h3 style="color: white;">Aggiungi alla lista</h3>
                <div class="input-wrapper" style="background: var(--card-bg); border-color: var(--border-dark);">
                    <input type="text" id="food-input" placeholder="Cosa ti serve?" autocomplete="off" style="color: white;">
                    <button id="add-btn" class="add-btn" style="background: var(--accent-green);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><path d="M12 5V19M5 12H19" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                </div>
                <ul id="suggestions" class="suggestions-list hidden" style="background: var(--card-bg); border-color: var(--border-dark); max-height: 200px;"></ul>
                <button id="close-add-modal" class="modal-close-btn" style="margin-top: 15px; background: rgba(255,255,255,0.1); color: white;">Annulla</button>
            </div>
        </div>
        
        <div id="pwa-banner" class="hidden"></div>
        <div id="notification-banner" class="hidden"></div>
    </div>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
